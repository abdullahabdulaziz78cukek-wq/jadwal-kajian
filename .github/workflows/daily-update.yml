name: Update jadwal kajian harian
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
      - run: python scrape_marimengaji.py
      - name: Simpan hasil ke repo
        run: |
          git config user.name "kajian-bot"
          git config user.email "bot@users.noreply.github.com"
          git add output/ docs/data.json masjid_master.csv
          git diff --cached --quiet || git commit -m "Update jadwal $(date -u +%F)"
          git push
