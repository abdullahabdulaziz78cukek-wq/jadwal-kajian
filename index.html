*{box-sizing:border-box}

.w{max-width:760px;margin:0 auto;padding:16px}

.sub{color:var(--muted);font-size:.9rem;margin:0 0 12px}
.f{display:grid;gap:8px;grid-template-columns:1fr 1fr}

.a{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.a a{text-decoration:none;background:var(--ac);color:var(--acfg);padding:8px 14px;border-radius:10px;font-size:.9rem}
.a a.o{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.e,.ft{color:var(--muted);text-align:center;font-size:.85rem;padding:18px 4px}

</style>
</head>

 for(var i=0;i<t.length;i++)if(j.indexOf(t[i][0])>=0)return t[i][1]*60;return 999}
function iso(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function lbl(d,i){var s=HN[d.getDay()]+", "+d.getDate()+" "+BL[d.getMonth()]+" "+d.getFullYear();
 return i===0?"Hari ini · "+s:i===1?"Besok · "+s:s}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function render(){
 var N=+document.getElementById("rg").value,q=document.getElementById("q").value.toLowerCase(),
 kt=document.getElementById("kt").value,mu=document.getElementById("mu").checked,
 t0=new Date();t0.setHours(0,0,0,0);var html="",n=0;SHOWN=[];
 for(var i=0;i<N;i++){var d=new Date(t0);d.setDate(t0.getDate()+i);var rows=[];
  D.r.forEach(function(r){
   var ok=r[8]?r[8]===iso(d):(HM[r[2]]===d.getDay()&&r[3].indexOf(String(Math.ceil(d.getDate()/7)))>=0);
   if(!ok)return;var m=D.m[r[5]]||["","","","",""];
   if(kt&&m[1]!==kt)return;if(mu&&r[7].indexOf("M")<0)return;
   if(q&&(r[0]+" "+r[1]+" "+r[5]).toLowerCase().indexOf(q)<0)return;rows.push([r,m])});
  if(!rows.length)continue;rows.sort(function(a,b){return jk(a[0][4])-jk(b[0][4])});
  html+="<h2>"+lbl(d,i)+"</h2>";
  rows.forEach(function(x){var r=x[0],m=x[1];n++;
   var map=m[2]?"https://www.google.com/maps?q="+m[2]+","+m[3]:(m[4]||"");
   SHOWN.push([new Date(d.getFullYear(),d.getMonth(),d.getDate(),12),r[0],r[1],r[5],m[0],m[1],m[2]===""?"":+m[2],m[3]===""?"":+m[3],r[4],r[6],(r[7].indexOf("M")>=0?"Khusus Muslimah ":"")+(r[7].indexOf("G")>=0?"Digantikan":"")]);
   html+='<div class="c"><div class="j">'+esc(r[4])+'</div><div class="t">'+esc(r[0])+'</div><div class="m">'+esc(r[1])+'</div>'
   +'<div class="m"><b>'+esc(r[5])+'</b>'+(m[1]?" · "+esc(m[1]):"")+'</div>'+(m[0]?'<div class="m">'+esc(m[0])+'</div>':"")
   +'<div style="margin-top:6px">'+(r[7].indexOf("M")>=0?'<span class="b">Muslimah</span>':"")+(r[7].indexOf("G")>=0?'<span class="b">Digantikan</span>':"")+'</div>'
   +'<div class="a">'+(map?'<a href="'+esc(map)+'" target="_blank" rel="noopener">📍 Peta</a>':"")
   +'<a class="o" href="'+esc(r[6])+'" target="_blank" rel="noopener">Detail</a></div></div>'})}
 document.getElementById("out").innerHTML=html||'<div class="e">Tidak ada kajian yang cocok. Coba perluas rentang hari atau ubah pencarian.</div>'}
function start(data){D=data;
 var ks={};Object.keys(D.m).forEach(function(k){if(D.m[k][1])ks[D.m[k][1]]=1});
 var s=document.getElementById("kt");s.innerHTML='<option value="">Semua kota/kabupaten</option>';Object.keys(ks).sort().forEach(function(k){var o=document.createElement("option");o.value=o.textContent=k;s.appendChild(o)});
 document.getElementById("sub").textContent=D.r.length+" jadwal kajian rutin · Sumatera Barat";
 document.getElementById("ft").textContent="Data per "+D.u+" · Sumber: marimengaji.com. Jam dan jadwal bisa berubah, cek halaman Detail.";
 if(!window.WIRED){window.WIRED=1;["q","rg","kt","mu"].forEach(function(id){document.getElementById(id).addEventListener("input",render)})}render()}
function msg(t){document.getElementById("ft").textContent=t}
function saveFile(name,data){
 return Promise.resolve().then(function(){return window.claude&&window.claude.use?window.claude.use("downloads"):null}).catch(function(){return null}).then(function(dl){
  if(dl)return dl.save({filename:name,data:data}).catch(function(e){if(!e||e.code!=="declined")msg("File tidak bisa disimpan di tampilan ini. Buka aplikasi lewat link biasa lalu coba lagi.")});
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data]));a.download=name;document.body.appendChild(a);a.click();a.remove()})}
function exportXl(){
 if(!SHOWN.length){msg("Tidak ada kajian untuk diekspor. Ubah filter dulu.");return}
 var H=["Tanggal","Judul Kajian","Nama Ustadz","Nama Masjid","Tempat (Alamat Lengkap)","Nama Kota/Kabupaten","Latitude","Longitude","Jam","Sumber Data","Catatan"];
 var nm="jadwal-kajian-"+iso(new Date());
 if(typeof XLSX==="undefined"){
  var csv="\ufeff"+[H].concat(SHOWN.map(function(r){return [iso(r[0])].concat(r.slice(1))})).map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(",")}).join("\r\n");
  return saveFile(nm+".csv",csv)}
 var ws=XLSX.utils.aoa_to_sheet([H].concat(SHOWN),{cellDates:true});
 ws["!cols"]=[12,44,30,30,60,20,12,12,24,52,22].map(function(w){return{wch:w}});
 for(var i=2;i<=SHOWN.length+1;i++)if(ws["A"+i])ws["A"+i].z="yyyy-mm-dd";
 var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Jadwal Kajian");
 return saveFile(nm+".xlsx",XLSX.write(wb,{bookType:"xlsx",type:"array"}))}
document.getElementById("xl").addEventListener("click",exportXl);
start(EMBED);
try{fetch("data.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(j){if(j&&j.r&&j.r.length>20)start(j)}).catch(function(){})}catch(e){}
</script>
